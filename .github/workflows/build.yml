name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --windowed --name SealImpressionTool main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SealImpressionTool-windows-x64
          path: dist/SealImpressionTool.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller --windowed --name SealImpressionTool main.py
      - name: Zip app
        run: cd dist && zip -r -y SealImpressionTool-macos.zip SealImpressionTool.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SealImpressionTool-macos
          path: dist/SealImpressionTool-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/SealImpressionTool-windows-x64/SealImpressionTool.exe
            artifacts/SealImpressionTool-macos/SealImpressionTool-macos.zip
